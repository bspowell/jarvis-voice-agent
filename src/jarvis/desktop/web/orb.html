<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Demo mode (orb.html#demo): try every look in a browser, on a dark, light or busy screen. */
  .controls { display: none; }
  body.demo {
    background: #04070a;
    color: #cfe9f2;
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  body.demo.light { background: #f5f6f8; }
  body.demo.busy {
    background:
      linear-gradient(115deg, transparent 0 55%, #e8a33d 55% 63%, transparent 63%),
      repeating-linear-gradient(0deg, #ffffff 0 22px, #dfe4ea 22px 24px, #ffffff 24px 46px, #1f2933 46px 49px),
      #ffffff;
  }
  body.demo canvas { margin: auto; width: min(78vmin, 520px); height: min(78vmin, 520px); }
  body.demo .controls {
    display: grid;
    gap: 14px;
    position: fixed;
    left: 16px;
    top: 16px;
    width: 220px;
    padding: 14px 16px 16px;
    border: 1px solid rgb(92 225 255 / 0.2);
    border-radius: 12px;
    background: rgb(6 18 26 / 0.82);
    backdrop-filter: blur(14px);
  }
  .controls fieldset { margin: 0; padding: 0; border: 0; display: grid; gap: 4px; }
  .controls legend { padding: 0 0 6px; color: #7fd8ef; }
  .controls label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .controls input { accent-color: #5ce1ff; margin: 0; }
  .controls input[type="range"] { flex: 1; }
  .controls :focus-visible { outline: 2px solid #5ce1ff; outline-offset: 2px; }
  @media (min-width: 760px) {
    body.demo canvas { left: 252px; }  /* the orb beside the controls, not under them */
  }
  @media (max-width: 520px) {
    body.demo .controls { top: auto; bottom: 16px; left: 16px; right: 16px; width: auto; }
  }
</style>
</head>
<body>
<canvas id="orb" aria-hidden="true"></canvas>

<form class="controls" aria-label="Try the orb">
  <fieldset>
    <legend>Jarvis is</legend>
    <label><input type="radio" name="look" value="away"> Away (not connected)</label>
    <label><input type="radio" name="look" value="asleep" checked> Asleep</label>
    <label><input type="radio" name="look" value="muted"> Muted (your mic)</label>
    <label><input type="radio" name="look" value="listening"> Listening to you</label>
    <label><input type="radio" name="look" value="thinking"> Thinking</label>
    <label><input type="radio" name="look" value="speaking"> Speaking</label>
  </fieldset>
  <fieldset>
    <legend>In the middle</legend>
    <label><input type="radio" name="core" value="jarvis" checked> Classic J.A.R.V.I.S.</label>
    <label><input type="radio" name="core" value="mjolnir"> Mjölnir</label>
    <label><input type="radio" name="core" value="stormbreaker"> Stormbreaker</label>
    <label><input type="radio" name="core" value="iron-man-1"> Arc reactor: Iron Man 1</label>
    <label><input type="radio" name="core" value="infinity-war"> Arc reactor: Infinity War</label>
  </fieldset>
  <label><input type="checkbox" name="voice" checked> Fake voice while speaking</label>
  <label>Loudness <input type="range" name="level" min="0" max="1" step="0.01" value="0.5"></label>
  <fieldset>
    <legend>Behind the orb</legend>
    <label><input type="radio" name="backdrop" value="dark" checked> Dark screen</label>
    <label><input type="radio" name="backdrop" value="light"> Light screen</label>
    <label><input type="radio" name="backdrop" value="busy"> Busy screen</label>
  </fieldset>
</form>

<script src="cores.js"></script>
<script src="orb.js"></script>
</body>
</html>
