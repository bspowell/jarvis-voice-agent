# Jarvis preferences. Safe to commit (secrets live in .env).
# Each phase adds its own section here.

[models]
jarvis = "claude-sonnet-5"     # the orchestrator: writes every reply you hear; streams even after tool calls
notes = "claude-haiku-4-5"
calendar = "claude-haiku-4-5"
search = "claude-haiku-4-5"    # quick web lookups: fastest (~1.5 s quicker than Sonnet 5.5)
search_deep = "claude-sonnet-5-5"  # "dig deeper" / "research": better judgment across searches
summarizer = "claude-haiku-4-5"  # condenses very long days (see [memory])
approvals = "claude-haiku-4-5"   # asks "Shall I…?" before any change, then reads your answer

[location]
home_city = "Vancouver, BC"    # used when your location can't be found from your IP address

[memory]
new_day_hour = 4               # today's conversation starts fresh at 4 AM, so late nights stay one chat

[auth]
remember_days = 30             # sign-ins (Google, Notion) last this long, then Jarvis asks you to confirm again

[files]
folders = ["~/Documents", "~/Desktop", "~/Downloads", "~/coding"]  # the only folders Jarvis may search, read or write in

[notion]
open_pages = true              # show each page Jarvis reads or writes in the Notion app

[voice]
stt_model = "flux-general-en"    # Deepgram Flux: turns your speech into text and hears when you've finished
tts_model = "eleven_v4_turbo"    # ElevenLabs model speaking in your Jarvis voice (ELEVENLABS_VOICE_ID in .env)
fallback_voice = "bm_george"     # Kokoro, offline: takes over if ElevenLabs fails
